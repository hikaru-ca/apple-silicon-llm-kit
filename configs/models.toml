# Model registry.
#
# Every id below was verified to exist on the Hugging Face Hub under the
# `mlx-community` organization. `mem_gb` is the approximate resident size of the
# weights alone -- add KV cache on top, which grows with context length.
#
# Reference machine for the `tok_s` estimates: Apple M4 Max, 40-core GPU,
# 64 GB unified memory (~546 GB/s). Treat them as order-of-magnitude only.
#
# `runtime` is the package that can actually load the architecture, taken from
# each model's own config.json `model_type` and checked against the installed
# packages. It is not cosmetic: mlx_lm.server loads lazily, so an unsupported
# model starts up looking healthy and only fails on the first real request, as
# an HTTP 404 that says nothing about the cause. scripts/launch.py reads this
# field to refuse the combination up front instead.
#
# mlx-lm 0.31.3 is the newest release there is, and it predates the Gemma 4 12B
# Unified architecture (`gemma4_unified`, added June 2026). Those two entries
# need mlx-vlm and cannot be served by `make up` today.

[models.e2b]
id = "mlx-community/gemma-4-e2b-it-4bit"
model_type = "gemma4"
runtime = "mlx-lm"
mem_gb = 2.5
tok_s = "120+"
note = "Smallest. Good for smoke tests and throughput experiments."

[models.e4b]
id = "mlx-community/gemma-4-E4B-it-OBLITERATED-mlx-8Bit"
model_type = "gemma4"
runtime = "mlx-lm"
mem_gb = 9.0
tok_s = "60-80"
note = "8-bit E4B. Community fine-tune, not an official Google build."

[models."12b"]
id = "mlx-community/gemma-4-12B-it-4bit"
model_type = "gemma4_unified"
runtime = "mlx-vlm"
mem_gb = 8.0
tok_s = "45-60"
note = "NOT servable by make up: gemma4_unified needs mlx-vlm. Use 26b-moe or 31b-qat."

[models."12b-qat"]
id = "mlx-community/gemma-4-12B-it-qat-OptiQ-4bit"
model_type = "gemma4_unified"
runtime = "mlx-vlm"
mem_gb = 8.0
tok_s = "45-60"
note = "NOT servable by make up: gemma4_unified needs mlx-vlm. Use 26b-moe or 31b-qat."

[models."26b-moe"]
id = "mlx-community/gemma-4-26b-a4b-it-4bit"
model_type = "gemma4"
runtime = "mlx-lm"
mem_gb = 16.0
tok_s = "50-80"
note = "MoE, ~4B active params per token. All 26B must be resident in memory."

[models."31b"]
id = "mlx-community/gemma-4-31b-4bit"
model_type = "gemma4"
runtime = "mlx-lm"
mem_gb = 19.0
tok_s = "18-25"
note = "Flagship dense model. Highest quality that still runs at usable speed."

[models."31b-qat"]
id = "mlx-community/gemma-4-31B-it-qat-OptiQ-4bit"
model_type = "gemma4"
runtime = "mlx-lm"
mem_gb = 19.0
tok_s = "16-18"
note = "Quantization-aware trained 31B. Measured, not estimated, on the reference machine."
